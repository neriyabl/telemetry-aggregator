[project]
name = "telemetry-aggregator"
version = "0.1.0"
description = "Network telemetry simulator and metrics server"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
    "structlog",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_simulator", "src/telemetry_api", "src/common"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["telemetry_simulator", "telemetry_api", "common"]
